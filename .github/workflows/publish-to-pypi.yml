name: Test & Publish 🐍 to PyPI 📦

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
  workflow_dispatch:
    inputs:
      versionIncrement:
        description: 'Type of version increment: major, minor, patch'
        required: true
        default: 'patch'
      specifiedVersion:
        description: 'Specify an exact version (e.g., 2.8.1) to override auto bumping'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write  # Required to comment on PRs

jobs:
  run-pytest-tests:
    runs-on: ubuntu-latest
    environment: pypi-deployment
    env:
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: 'us5.datadoghq.com'
      DD_SERVICE: 'wrenchcl'
      DD_ENV: 'prod'

    steps:
    - uses: actions/checkout@v4

    # Setup Python
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U ddtrace
        pip install -r requirements.txt
        pip install pytest pytest-mock pytest-md-report pandas
        pip install coverage pytest-cov pytest-github-actions-annotate-failures

    # Install the package in editable mode
    - name: Install the package in editable mode
      run: pip install -e .

    # Run pytest with Markdown Report
    - name: Run pytest with Markdown Report
      env:
        REPORT_OUTPUT: md_report.md
        DD_ENV: prod
        DD_SERVICE: wrenchcl
        DD_TRACE_DEBUG: 'true'
      run: |
        echo "REPORT_FILE=${REPORT_OUTPUT}" >> "$GITHUB_ENV"
        ddtrace-run pytest --cov=WrenchCL --cov-report=lcov:coverage/lcov.info --md-report --md-report-flavor gfm --md-report-output "$REPORT_OUTPUT" ./tests -rs --ddtrace
        coverage report

    # Upload Markdown Report
    - name: Upload Markdown Report
      uses: actions/upload-artifact@v4
      with:
        name: MarkdownTestReport
        path: md_report.md

    # Add Test Report as a PR Comment (only if tests fail)
    - name: Add Test Report to PR
      if: failure() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: "Test Report"
        recreate: true
        path: ${{ env.REPORT_FILE }}

    # Upload coverage report (optional)
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage/lcov.info

    # Publish test report summary to GitHub Actions UI
    - name: Publish Coverage in Build Summary
      if: failure()
      run: cat md_report.md >> $GITHUB_STEP_SUMMARY
      shell: bash

    # Annotate if all tests pass
    - name: Annotate successful test completion
      if: success()
      run: echo "::notice ::All tests passed! ✔️"

    # Inform about manual workflow dispatch
    - name: Manual workflow dispatch instruction
      if: success()
      run: echo "To publish your package, please invoke the 'build-n-publish' workflow manually."

  build-n-publish:
    runs-on: ubuntu-latest
    needs: run-pytest-tests
    if: ${{ github.event_name == 'workflow_dispatch'}}
    environment: pypi-deployment
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Fetch all tags
      run: git fetch --tags

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install setuptools wheel pandas
        pip install -e .

    # Auto bump version, push tag, and create release
    - name: Auto bump version, push tag, and create release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Fetch the latest version tag
        LATEST_TAG=$(git tag -l "v[0-9]*" --sort=-version:refname | head -n 1)
        if [[ -z "$LATEST_TAG" ]]; then
          LATEST_TAG="v0.0.0"
        fi
        BASE_VERSION=$(echo "$LATEST_TAG" | cut -d 'v' -f 2)
    
        # Check if a specific version is provided
        if [[ -n "${{ github.event.inputs.specifiedVersion }}" ]]; then
          NEW_VERSION="v${{ github.event.inputs.specifiedVersion }}"
          echo "Using manually specified version: $NEW_VERSION"
        else
          # Parse the base version
          MAJOR=$(echo "$BASE_VERSION" | cut -d '.' -f 1)
          MINOR=$(echo "$BASE_VERSION" | cut -d '.' -f 2)
          PATCH=$(echo "$BASE_VERSION" | cut -d '.' -f 3)
    
          # Determine the next version based on input increment
          case ${{ github.event.inputs.versionIncrement }} in
            major)
              MAJOR=$((MAJOR+1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR+1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH+1))
              ;;
          esac
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Auto-bumped version to: $NEW_VERSION"
        fi

        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        sed -i "s/version='.*'/version='$NEW_VERSION'/" setup.py

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag $NEW_VERSION
        git push origin $NEW_VERSION

        curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/$GITHUB_REPOSITORY/releases \
          -d '{
            "tag_name": "'"$NEW_VERSION"'",
            "name": "Release '"$NEW_VERSION"'",
            "body": "Auto-generated release for version '"$NEW_VERSION"'"
          }'

    # Build the package
    - name: Build the package
      run: python setup.py sdist bdist_wheel

    # Publish to PyPI
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
