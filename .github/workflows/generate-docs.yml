name: Build and Deploy Docs (pdoc)

on:
  push:
    branches: [release]
    paths:
      - 'WrenchCL/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + pdoc
        run: |
          python -m pip install --upgrade pip
          pip install . pdoc

      - name: Generate API docs
        run: |
          pdoc -o site WrenchCL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
